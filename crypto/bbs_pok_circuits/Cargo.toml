[package]
name = "bbs_pok_circuits"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-std = { workspace = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-snark = { version = "0.4" }
serde = { workspace = true }
serde_with = { workspace = true }
blake2 = { workspace = true }
digest = { workspace = true }
bbs_plus = { path = "../bbs_plus" }

[features]
default = ["std"]
std = [
  "ark-ff/std", "ark-ec/std", "ark-std/std", "ark-relations/std", "ark-r1cs-std/std",
  "ark-groth16/std", "ark-serialize/std", "serde/std", "bbs_plus/std"
]

[dev-dependencies]
rand = "0.8"
serde_json = "1"
hex = "0.4"
ethers = { version = "2", default-features = false, features = ["rustls"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
eyre = "0.6"
num-bigint = "0.4"
num-traits = "0.2"
sha3 = "0.10"
dock_crypto_utils = { path = "../utils" }
