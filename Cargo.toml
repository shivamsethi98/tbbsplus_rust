[package]
name = "tbbsplus_rust"
version = "0.1.0"
edition = "2021"
autobins = false

# Main library dependencies for examples (using local crypto libraries)
[dependencies]
bbs_plus = { path = "crypto/bbs_plus" }
ark-bls12-381 = "0.4"
ark-ff = "0.4"  
ark-ec = "0.4"
ark-std = "0.4"
blake2 = "0.10"
ark-serialize = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
thiserror = "1.0"
hex = "0.4"
dotenvy = "0.15"
eyre = "0.6"

# Additional dependencies for selective disclosure example (using local crypto libraries)
schnorr_pok = { path = "crypto/schnorr_pok" }
dock_crypto_utils = { path = "crypto/utils" }

# Additional dependencies for threshold examples (using local crypto libraries)
secret_sharing_and_dkg = { path = "crypto/secret_sharing_and_dkg" }
anyhow = "1.0"

# Additional dependencies for hybrid verification example
proof_system = { path = "crypto/proof_system" }
legogroth16 = { path = "crypto/legogroth16" }
libp2p = { version = "0.54", default-features = false, features = ["tcp", "dns", "tokio", "noise", "yamux", "gossipsub", "mdns", "identify", "request-response", "cbor", "kad", "macros"], optional = true }
oblivious_transfer_protocols = { path = "crypto/oblivious_transfer" }
test_utils = { path = "crypto/test_utils" }
sha3 = "0.10"
base64 = "0.21"
rand = "0.8"
futures = "0.3"
ethers = { version = "2", default-features = false, features = ["abigen", "ws", "rustls"] }
vb_accumulator = { path = "crypto/vb_accumulator" }
once_cell = "1.19"
fs2 = "0.4"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
short_group_sig = { path = "crypto/short_group_sig" }
ethereum-types = "0.15.1"

[features]
mpc = ["libp2p"]
interactive = []

[[bin]]
name = "issuer_onchain"
path = "src/bin/issuer_onchain.rs"
required-features = ["mpc"]

[[bin]]
name = "client"
path = "src/bin/client/main.rs"
required-features = ["mpc"]


[[bin]]
name = "ttp"
path = "src/bin/ttp.rs"



[[bin]]
name = "export_pok_json"
path = "src/bin/export_pok_json.rs"


[[bin]]
name = "cred_status"
path = "src/bin/cred_status.rs"

[[bin]]
name = "service_provider"
path = "src/bin/service_provider.rs"

[[bin]]
name = "opener_threshold"
path = "src/bin/opener_threshold.rs"
required-features = ["mpc"]

[[bin]]
name = "opener_aggregator"
path = "src/bin/opener_aggregator.rs"
required-features = ["mpc"]

[[bin]]
name = "issuance_metrics"
path = "metrics/scenarios/issuance_sum.rs"

[[bin]]
name = "presentation_metrics"
path = "metrics/scenarios/presentation_metrics.rs"
[[bin]]
name = "acc_register_info_metrics"
path = "metrics/scenarios/acc_register_info_metrics.rs"

[[bin]]
name = "sp_agg_open_revoke"
path = "metrics/scenarios/sp_agg_open_revoke.rs"

[[bin]]
name = "deploy_gas_metrics"
path = "metrics/scenarios/deploy_gas_metrics.rs"

[[bin]]
name = "benchmark_batching"
path = "src/bin/benchmark_batching.rs"

[[bin]]
name = "presentation_aggregator"
path = "src/bin/presentation_aggregator.rs"

[[bin]]
name = "request_aggregator"
path = "src/bin/request_aggregator.rs"
